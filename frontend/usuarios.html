<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>BioMant IA - Gestión de Usuarios</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: #f4f6f9; padding: 20px; color: #333; margin: 0; }
        .nav-bar { display: flex; justify-content: space-between; align-items: center; background: #003366; padding: 15px 25px; border-radius: 8px; margin-bottom: 20px; }
        .nav-bar a { color: white; text-decoration: none; font-weight: bold; font-size: 14px; }
        .btn-logout { background: #dc3545; color: white; border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .container { max-width: 950px; margin: auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.05); }
        form { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 30px; background: #f8f9fa; padding: 20px; border-radius: 6px; border: 1px solid #e9ecef; }
        .form-group { display: flex; flex-direction: column; }
        label { font-weight: bold; margin-bottom: 5px; font-size: 13px; }
        input, select { padding: 9px; border: 1px solid #ccc; border-radius: 4px; font-size: 13px; }
        button.btn-submit { grid-column: span 2; background: #003366; color: white; border: none; padding: 12px; font-weight: bold; border-radius: 4px; cursor: pointer; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; font-size: 13px; }
        th { background: #003366; color: white; }
    </style>
</head>
<body>
    <div class="container">
        <div class="nav-bar">
            <a href="/static/index.html">← Volver al Inventario</a>
            <button class="btn-logout" onclick="localStorage.removeItem('usuarioLogueado'); window.location.href='/static/index.html';">Cerrar Sesión</button>
        </div>

        <h2 style="color: #003366;">Crear Credenciales</h2>
        <form id="formUsuario" onsubmit="event.preventDefault(); registrarUsuario();">
            <div class="form-group"><label>Nombre Completo:</label><input type="text" id="usu_nombre" required></div>
            <div class="form-group"><label>Correo:</label><input type="email" id="usu_email" required></div>
            <div class="form-group"><label>Contraseña:</label><input type="password" id="usu_password" required></div>
            <div class="form-group">
                <label>Rol:</label>
                <select id="usu_rol">
                    <option value="tecnico">Técnico Biomédico</option>
                    <option value="admin">Administrador de Sede</option>
                    <option id="optSuperAdmin" value="super_admin" style="display:none;">Súper Administrador</option>
                </select>
            </div>
            <div class="form-group" style="grid-column: span 2;" id="divEmpresa">
                <label>Empresa a la que pertenece:</label>
                <select id="usu_empresa" required></select>
            </div>
            <button type="submit" class="btn-submit">Crear Usuario</button>
        </form>

        <h2 style="color: #003366;">Personal Activo</h2>
        <table>
            <thead><tr><th>Nombre</th><th>Correo</th><th>Rol</th><th>Empresa</th><th>Estado</th><th>Acción</th></tr></thead>
            <tbody id="tablaUsuarios"></tbody>
        </table>
    </div>

    <script>
        const API_URL = window.location.hostname === "localhost" || window.location.hostname === "127.0.0.1" 
            ? "http://127.0.0.1:8000" 
            : "";
        let empresasMap = {};
        let usuarioActual = null;

        window.addEventListener("DOMContentLoaded", async () => {
            const sesion = sessionStorage.getItem("usuarioLogueado"); // ✅ Ahora lee correctamente la sesión activa
            if (!sesion) { window.location.href = "/static/index.html"; return; }
            usuarioActual = JSON.parse(sesion);
            if (usuarioActual.rol === "tecnico") { window.location.href = "/static/index.html"; return; }

            if (usuarioActual.rol === "super_admin") {
                document.getElementById("optSuperAdmin").style.display = "block";
            }

            const resEmp = await fetch(`${API_URL}/empresas/`);
            const empresas = await resEmp.json();
            const selectEmp = document.getElementById("usu_empresa");

            empresas.forEach(emp => {
                empresasMap[emp.id] = emp.nombre;
                if (usuarioActual.rol === "admin" && emp.id !== usuarioActual.empresa_id) return;
                let opt = document.createElement("option");
                opt.value = emp.id;
                opt.text = emp.nombre;
                selectEmp.appendChild(opt);
            });

            cargarUsuarios();
        });

        async function cargarUsuarios() {
            let url = `${API_URL}/usuarios/`;
            if (usuarioActual.rol === "admin" && usuarioActual.empresa_id) {
                url += `?empresa_id=${usuarioActual.empresa_id}`;
            }
            const res = await fetch(url);
            const usuarios = await res.json();
            const tbody = document.getElementById("tablaUsuarios");
            
            tbody.innerHTML = usuarios.map(u => `
                <tr>
                    <td>${u.nombre_completo}</td><td>${u.email}</td><td>${u.rol}</td>
                    <td>${empresasMap[u.empresa_id] || 'SaaS Admin'}</td>
                    <td style="color: ${u.activo ? 'green' : 'red'}; font-weight:bold;">${u.activo ? 'Activo' : 'Inactivo'}</td>
                    <td><button onclick="cambiarEstado(${u.id})" style="background:${u.activo?'#dc3545':'#28a745'}; color:white; border:none; padding:5px 10px; border-radius:4px; cursor:pointer;">${u.activo?'Inhabilitar':'Activar'}</button></td>
                </tr>
            `).join('');
        }

        async function registrarUsuario() {
            const nuevo = {
                nombre_completo: document.getElementById("usu_nombre").value, email: document.getElementById("usu_email").value,
                password: document.getElementById("usu_password").value, rol: document.getElementById("usu_rol").value,
                empresa_id: parseInt(document.getElementById("usu_empresa").value)
            };
            const res = await fetch(`${API_URL}/usuarios/`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(nuevo) });
            if (res.ok) { alert("Usuario creado"); document.getElementById("formUsuario").reset(); cargarUsuarios(); }
            else { alert("Error al registrar"); }
        }

        async function cambiarEstado(id) {
            await fetch(`${API_URL}/usuarios/${id}/estado`, { method: "PATCH" });
            cargarUsuarios();
        }
    </script>
</body>
</html>
