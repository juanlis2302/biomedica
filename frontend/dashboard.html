<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>BioMant IA - Dashboard</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f4f6f9; padding: 20px; }
        .container { max-width: 1200px; margin: auto; }
        .kpi-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .kpi-card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); text-align: center; }
        .alert-row { background: #fee2e2 !important; color: #991b1b; font-weight: bold; }
        table { width: 100%; border-collapse: collapse; background: white; border-radius: 8px; overflow: hidden; }
        th, td { padding: 12px; border: 1px solid #ddd; text-align: left; }
        th { background: #003366; color: white; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Panel de Control Biomédico</h1>
        <div class="nav-bar"><a href="index.html">← Volver al Inventario</a></div>

        <div class="kpi-container">
            <div class="kpi-card"><h3>Equipos Totales</h3><p id="totalEquipos">0</p></div>
            <div class="kpi-card"><h3>Pendientes Mtto</h3><p id="pendientesMtto" style="color:red;"></p></div>
        </div>

        <h3>Equipos Próximos a Mantenimiento (Próximos 7 días)</h3>
        <table>
            <thead><tr><th>Equipo</th><th>Serie</th><th>Próximo Mtto</th><th>Acción</th></tr></thead>
            <tbody id="tablaAlertas"></tbody>
        </table>
    </div>

    <script>
        const API_URL = "http://127.0.0.1:8000";

        async function cargarDashboard() {
            const usuario = JSON.parse(sessionStorage.getItem("usuarioLogueado"));
            const res = await fetch(`${API_URL}/equipos/?empresa_id=${usuario.empresa_id}`);
            const equipos = await res.json();
            
            document.getElementById("totalEquipos").innerText = equipos.length;
            
            const tabla = document.getElementById("tablaAlertas");
            const hoy = new Date();
            const semanaQueViene = new Date();
            semanaQueViene.setDate(hoy.getDate() + 7);

            let pendientesCount = 0;
            tabla.innerHTML = "";

            equipos.forEach(eq => {
                if (eq.proximo_mtto) {
                    const fechaMtto = new Date(eq.proximo_mtto);
                    if (fechaMtto <= semanaQueViene) {
                        pendientesCount++;
                        tabla.innerHTML += `
                            <tr class="alert-row">
                                <td>${eq.nombre_equipo}</td>
                                <td>${eq.serie}</td>
                                <td>${eq.proximo_mtto}</td>
                                <td><button onclick="location.href='mantenimientos.html?equipo_id=${eq.id}'">Registrar</button></td>
                            </tr>`;
                    }
                }
            });
            document.getElementById("pendientesMtto").innerText = pendientesCount;
        }

        window.onload = cargarDashboard;
    </script>
</body>
</html>
